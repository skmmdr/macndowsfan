[package]
name = "macndowsfan"
version = "0.1.0"
edition = "2021"
description = "Fan control and temperature monitoring for Apple Macs running Windows (Boot Camp)"
license = "MIT"

[lib]
name = "macndowsfan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
